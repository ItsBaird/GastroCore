worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 3m;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Solo POST cuenta para el limite del login; llave vacia = sin limite
    map $request_method $login_key {
        POST    $binary_remote_addr;
        default '';
    }

    limit_req_zone $login_key zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=public_qr:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Errores propios del gateway en JSON
        error_page 404 = @err_404;
        error_page 429 = @err_429;
        error_page 502 = @err_502;
        error_page 503 = @err_503;
        error_page 504 = @err_504;

        location @err_404 {
            internal;
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Recurso no encontrado","details":{}}}';
        }
        location @err_429 {
            internal;
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Demasiadas solicitudes","details":{}}}';
        }
        location @err_502 {
            internal;
            default_type application/json;
            return 502 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Servicio no disponible","details":{}}}';
        }
        location @err_503 {
            internal;
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Servicio no disponible","details":{}}}';
        }
        location @err_504 {
            internal;
            default_type application/json;
            return 504 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Tiempo de espera agotado","details":{}}}';
        }

        # Los errores generados por los servicios (404 de Express, etc.) pasan tal cual
        proxy_intercept_errors off;

        location = /api/auth/login {
            limit_req zone=login burst=4 nodelay;
            set $auth_up http://auth:3001;
            proxy_pass $auth_up;
        }

        location /api/auth/ {
            set $auth_up http://auth:3001;
            proxy_pass $auth_up;
        }

        location /api/staff/ {
            set $staff_up http://staff:3002;
            proxy_pass $staff_up;
        }

        # Endpoints publicos del canal QR (sin login): limite por IP
        location /api/orders/qr/ {
            limit_req zone=public_qr burst=10 nodelay;
            set $orders_up http://orders:3004;
            proxy_pass $orders_up;
        }

        location /api/catalog/public/ {
            limit_req zone=public_qr burst=10 nodelay;
            set $catalog_up http://catalog:3003;
            proxy_pass $catalog_up;
        }

        location /api/orders/ {
            set $orders_up http://orders:3004;
            proxy_pass $orders_up;
        }

        location /api/catalog/ {
            set $catalog_up http://catalog:3003;
            proxy_pass $catalog_up;
        }

        location /socket.io/ {
            set $orders_up http://orders:3004;
            proxy_pass $orders_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /internal/ {
            return 404;
        }

        location /api/ {
            return 404;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
