openapi: 3.0.3
info:
  title: GastroCore API
  version: 0.1.0
  description: |
    Contrato de la API de GastroCore (fuente de verdad, RNF-10). Todas las rutas entran por el gateway
    (Nginx) y conservan su prefijo completo: `/api/<servicio>/...`.

    Convenciones: JSON en camelCase (R6), IDs UUID v4, fechas en UTC (ISO 8601), dinero en pesos
    colombianos enteros (R5). El cliente nunca envia precios ni totales (R4): los calcula el backend.

    Formato de error uniforme en todos los servicios:
    `{ "error": { "code": "NOT_FOUND", "message": "Recurso no encontrado", "details": {} } }`.

    Las rutas `/internal/*` solo son accesibles dentro de la red de Docker (el gateway las bloquea) y
    exigen la cabecera `X-Service-Token`; las llamadas entre servicios tienen timeout de 3 s y, si el
    servicio consultado no responde, el consumidor devuelve `503 DEPENDENCY_UNAVAILABLE`.

    Los detalles marcados como (propuesto) no estan fijados en la documentacion y deben validarse con el equipo.
servers:
  - url: http://localhost
    description: Desarrollo local (gateway)
tags:
  - name: Health
  - name: Auth
  - name: Staff
  - name: Catalog
  - name: Orders - Mesas
  - name: Orders - Pedidos
  - name: Orders - Cocina
  - name: Orders - Cobro
  - name: Orders - Metodos de pago
  - name: Orders - QR
  - name: Orders - Reportes
  - name: Internal

security:
  - bearerAuth: []

paths:
  # ───────────── Health ─────────────
  /api/auth/health:
    get:
      tags: [Health]
      summary: Estado del servicio auth
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /api/staff/health:
    get:
      tags: [Health]
      summary: Estado del servicio staff
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /api/catalog/health:
    get:
      tags: [Health]
      summary: Estado del servicio catalog
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /api/orders/health:
    get:
      tags: [Health]
      summary: Estado del servicio orders
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }

  # ───────────── Auth (F01) ─────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Crear una cuenta de usuario (ADMIN)
      description: GC-AUTH-0001. Contrasena temporal de minimo 10 caracteres; se guarda con argon2id.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El email ya esta registrado (`EMAIL_ALREADY_EXISTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/users:
    get:
      tags: [Auth]
      summary: Listar usuarios (ADMIN)
      x-roles: [ADMIN]
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Auth]
      summary: Obtener un usuario (ADMIN)
      x-roles: [ADMIN]
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Auth]
      summary: Cambiar rol o bloquear/desbloquear un usuario (ADMIN)
      description: |
        REQ-F01-07. Solo cambia `role` e `isActive`; email y contrasena no se editan aqui. Con
        `isActive=false` se revocan los refresh tokens del usuario; con `isActive=true` se limpia el
        bloqueo por intentos fallidos. Un ADMIN no puede quitarse el rol ni desactivarse a si mismo (403).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Auth]
      summary: Desactivar un usuario (ADMIN)
      description: |
        Desactivacion logica (`isActive=false`); no borra el registro y revoca los refresh tokens.
        Es idempotente. Un ADMIN no puede desactivarse a si mismo (403).
      x-roles: [ADMIN]
      responses:
        '204': { description: Usuario desactivado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      description: |
        GC-AUTH-0002. Emite un access token JWT RS256 (15 min) en el cuerpo y un refresh token
        (7 dias) en cookie `refreshToken` con `httpOnly; Secure; SameSite=Strict; Path=/api/auth`. Bloqueo de 15 minutos tras 5 intentos
        fallidos (configurable). Cuenta desactivada: mismo 401. Limite del gateway: 5 por minuto por IP. El 401 no revela cual dato es incorrecto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesion iniciada
          headers:
            Set-Cookie:
              description: Refresh token (httpOnly; Secure; SameSite=Strict)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '423':
          description: Cuenta bloqueada temporalmente (`ACCOUNT_LOCKED`); `details.lockedUntil` indica cuando termina
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar el access token
      description: Usa la cookie del refresh token y lo rota (el anterior queda invalidado).
      security: []
      responses:
        '200':
          description: Nuevo access token
          headers:
            Set-Cookie:
              description: Nuevo refresh token rotado
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesion (revoca el refresh token)
      responses:
        '204': { description: Sesion cerrada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Datos de la sesion actual
      responses:
        '200':
          description: Sesion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ───────────── Staff (F02) ─────────────
  /api/staff/employees:
    get:
      tags: [Staff]
      summary: Listar empleados (ADMIN)
      x-roles: [ADMIN]
      responses:
        '200':
          description: Empleados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Staff]
      summary: Registrar el perfil laboral de un empleado (ADMIN)
      description: GC-STAFF-0001. El userId debe existir en Auth; el documento es unico.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeRequest' }
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/staff/employees/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Staff]
      summary: Obtener un empleado (ADMIN)
      x-roles: [ADMIN]
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Staff]
      summary: Editar un empleado (ADMIN)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200':
          description: Empleado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/staff/shifts:
    get:
      tags: [Staff]
      summary: Listar turnos por semana o empleado
      parameters:
        - name: week
          in: query
          description: Cualquier fecha de la semana a consultar
          schema: { type: string, format: date }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Turnos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Staff]
      summary: Programar un turno (ADMIN)
      description: GC-STAFF-0002. El turno nace en estado `programado`; el fin debe ser posterior al inicio.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShiftRequest' }
      responses:
        '201':
          description: Turno creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/staff/shifts/{id}/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Staff]
      summary: Iniciar el turno (WAITER, COOK)
      description: GC-STAFF-0003. Solo si la hora actual esta dentro del rango programado.
      x-roles: [WAITER, COOK, ADMIN]
      responses:
        '200':
          description: Turno activo (registra actualStart)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /api/staff/shifts/{id}/end:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Staff]
      summary: Finalizar el turno (WAITER, COOK)
      description: |
        Staff consulta a Orders (`GET /internal/tables/open?waiterId=`). Si el mesero tiene mesas
        abiertas responde `409 HAS_OPEN_TABLES`.
      x-roles: [WAITER, COOK, ADMIN]
      responses:
        '200':
          description: Turno finalizado (registra actualEnd)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Mesas abiertas (`HAS_OPEN_TABLES`) o transicion invalida (`INVALID_TRANSITION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  # ───────────── Catalog (F03) ─────────────
  /api/catalog/categories:
    get:
      tags: [Catalog]
      summary: Listar categorias
      responses:
        '200':
          description: Categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Catalog]
      summary: Crear una categoria (ADMIN)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Categoria creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Catalog]
      summary: Editar una categoria (ADMIN)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Categoria actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog/products:
    get:
      tags: [Catalog]
      summary: Listar productos (incluye no disponibles)
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Catalog]
      summary: Crear un producto con foto (ADMIN)
      description: |
        GC-CAT-0001. `multipart/form-data`. La foto es obligatoria (JPG, PNG o WebP, maximo 2 MB; se
        valida el tipo real y el servidor genera el nombre del archivo).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductForm' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Catalog]
      summary: Obtener un producto
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      summary: Editar un producto o cambiar su disponibilidad (ADMIN)
      description: |
        Cambiar el precio no altera los snapshots de ordenes existentes (R3). Con `isAvailable=false`
        el producto sale del menu publico y no se puede agregar a nuevas rondas.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductForm' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/catalog/public/menu:
    get:
      tags: [Catalog]
      summary: Menu publico (sin login)
      description: Productos disponibles con foto y precio, agrupados por categoria. Limite por IP en el gateway.
      security: []
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuCategory' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────── Orders - Metodos de pago (GC-ADM-0001) ─────────────
  /api/orders/payment-methods:
    get:
      tags: [Orders - Metodos de pago]
      summary: Listar metodos de pago
      description: Los meseros solo necesitan los activos (`?active=true`).
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Metodos de pago
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Orders - Metodos de pago]
      summary: Crear un metodo de pago (ADMIN)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodInput' }
      responses:
        '201':
          description: Metodo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders/payment-methods/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - Metodos de pago]
      summary: Editar o desactivar un metodo de pago (ADMIN)
      description: Un metodo desactivado no aparece al cobrar pero se conserva en los registros historicos.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodInput' }
      responses:
        '200':
          description: Metodo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────── Orders - Mesas (F04) ─────────────
  /api/orders/tables:
    get:
      tags: [Orders - Mesas]
      summary: Listar mesas
      responses:
        '200':
          description: Mesas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiningTable' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Orders - Mesas]
      summary: Crear una mesa (ADMIN)
      description: GC-ADM-0002. El servidor genera un `qrToken` aleatorio de al menos 128 bits (no es el id de la mesa).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TableInput' }
      responses:
        '201':
          description: Mesa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders/tables/status:
    get:
      tags: [Orders - Mesas]
      summary: Panel de mesas con su estado actual
      description: |
        GC-ORD-0001. Estado derivado de la orden abierta: `libre` (verde), `ocupada` (naranja) o
        `en_cobro` (azul), con mesero asignado y llamados pendientes. Los cambios llegan por el evento
        Socket.io `table:status_changed`.
      x-roles: [WAITER, ADMIN]
      responses:
        '200':
          description: Estado de todas las mesas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TableStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orders/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - Mesas]
      summary: Editar una mesa (ADMIN)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TableInput' }
      responses:
        '200':
          description: Mesa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders/tables/{id}/open:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Orders - Mesas]
      summary: Abrir una mesa libre (WAITER con turno activo)
      description: |
        GC-ORD-0002. Verifica el turno activo contra Staff (`GET /internal/shifts/active/:userId`), crea la
        orden `ABIERTA` con `openedBy` y `waiterId` del mesero, y marca como atendidos los llamados pendientes.
      x-roles: [WAITER, ADMIN]
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sin turno activo (`NO_ACTIVE_SHIFT`) o mesa ya abierta (`TABLE_ALREADY_OPEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/orders/tables/{id}/reassign:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - Mesas]
      summary: Reasignar una mesa abierta a otro mesero (ADMIN)
      description: GC-ADM-0003. Actualiza `waiterId`; `openedBy` no cambia. Queda en auditoria.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [waiterId]
              properties:
                waiterId: { type: string, format: uuid }
      responses:
        '200':
          description: Orden reasignada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  # ───────────── Orders - Pedidos (F05, F07, F11) ─────────────
  /api/orders/{orderId}/rounds:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders - Pedidos]
      summary: Crear una ronda de pedido (mesero asignado)
      description: |
        GC-ORD-0003. El cliente solo envia `productId`, `quantity` y `note` (R4). Orders consulta a Catalog,
        copia nombre y precio (snapshot R3), crea los items en `pendiente` y emite `round:created` a la sala `kitchen`.
        Un producto no disponible se informa y no se incluye en la ronda.
      x-roles: [WAITER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoundRequest' }
      responses:
        '201':
          description: Ronda creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRoundResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/orders/items/{id}/deliver:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - Pedidos]
      summary: Marcar un item listo como entregado (mesero asignado)
      description: GC-ORD-0005. Registra `deliveredAt`.
      x-roles: [WAITER, ADMIN]
      responses:
        '200':
          description: Item entregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /api/orders/items/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Orders - Pedidos]
      summary: Anular un item indicando el motivo
      description: |
        GC-ORD-0009. El mesero asignado solo puede anular items `pendiente`; los `en_preparacion` o `listo`
        solo los anula el ADMIN (queda en auditoria). Un mesero fuera de ese caso recibe `403 FORBIDDEN`.
      x-roles: [WAITER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Item cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  # ───────────── Orders - Cocina (F06) ─────────────
  /api/orders/kitchen:
    get:
      tags: [Orders - Cocina]
      summary: Kitchen display (COOK)
      description: GC-ORD-0004. Rondas con items `pendiente` o `en_preparacion`, la mas antigua primero.
      x-roles: [COOK, ADMIN]
      responses:
        '200':
          description: Rondas en cocina
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KitchenRound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orders/items/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - Cocina]
      summary: Avanzar el estado de un item (COOK)
      description: |
        `pendiente` -> `en_preparacion` (registra `preparationStartedAt`) -> `listo` (registra `readyAt`).
        Emite `item:status_changed` a las salas `kitchen` y `waiter:{userId}`. Cualquier otra transicion
        responde `409 INVALID_TRANSITION`.
      x-roles: [COOK, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [en_preparacion, listo]
      responses:
        '200':
          description: Item actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  # ───────────── Orders - Cobro (F08) ─────────────
  /api/orders/{orderId}/bill:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders - Cobro]
      summary: Generar la cuenta (mesero asignado)
      description: |
        GC-ORD-0006. Items no cancelados con los precios del snapshot, subtotal, descuento y total calculados
        en el backend (R4). La mesa pasa a `en_cobro` (orden `EN_COBRO`).
      x-roles: [WAITER, ADMIN]
      responses:
        '200':
          description: Cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /api/orders/{orderId}/cancel-bill:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders - Cobro]
      summary: Cancelar el cobro (propuesto)
      description: La mesa vuelve a `ocupada` y se pueden agregar mas rondas. La ruta no esta fijada en la documentacion.
      x-roles: [WAITER, ADMIN]
      responses:
        '200':
          description: Orden de nuevo `ABIERTA`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /api/orders/{orderId}/discount:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders - Cobro]
      summary: Aplicar un descuento (permiso discount:apply)
      description: GC-ORD-0007. Registra `discountAmount`, `discountAppliedBy` y `discountAppliedAt`, y crea un registro de auditoria.
      x-roles: [WAITER, ADMIN]
      x-permissions: ['discount:apply']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discountAmount]
              properties:
                discountAmount:
                  type: integer
                  minimum: 1
                  description: Pesos colombianos enteros
      responses:
        '200':
          description: Orden con descuento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /api/orders/{orderId}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders - Cobro]
      summary: Registrar el pago y cerrar la orden (mesero asignado)
      description: |
        GC-ORD-0008. Con un metodo en efectivo (`isCash`) se envia `amountReceived` y el backend calcula
        `changeGiven = amountReceived - total` (R4). Si el monto es insuficiente se rechaza (codigo propuesto
        `INSUFFICIENT_AMOUNT`). La orden queda `CERRADA` y la mesa `libre`.
      x-roles: [WAITER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodId]
              properties:
                paymentMethodId: { type: string, format: uuid }
                amountReceived:
                  type: integer
                  minimum: 0
                  description: Solo para metodos en efectivo
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400':
          description: Datos invalidos o monto insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  # ───────────── Orders - QR (F09) ─────────────
  /api/orders/qr/{token}:
    parameters:
      - $ref: '#/components/parameters/QrToken'
    get:
      tags: [Orders - QR]
      summary: Estado de la mesa y capacidades del canal QR (publico)
      description: |
        GC-QR-0001. Valida el token y devuelve el estado de la mesa. Capacidades: `libre` -> menu y llamar al
        mesero; `ocupada` -> ademas solicitudes de pedido y pedir la cuenta; `en_cobro` -> menu y llamar al mesero.
      security: []
      responses:
        '200':
          description: Mesa y capacidades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrTable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/orders/qr/{token}/call:
    parameters:
      - $ref: '#/components/parameters/QrToken'
    post:
      tags: [Orders - QR]
      summary: Llamar al mesero (publico)
      description: |
        GC-QR-0002. Crea un `service_call` `call_waiter` y emite `waiter:called` a la sala `waiters` (mesa libre)
        o a `waiter:{userId}` (mesa ocupada). Si ya hay uno pendiente del mismo tipo responde 409.
      security: []
      responses:
        '201':
          description: Llamado creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCall' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/orders/qr/{token}/request:
    parameters:
      - $ref: '#/components/parameters/QrToken'
    post:
      tags: [Orders - QR]
      summary: Enviar una solicitud de pedido (publico, mesa ocupada)
      description: |
        GC-QR-0003. Crea una `qr_request` `pendiente` y emite `qr_request:created` a `waiter:{userId}`.
        Con la mesa libre responde `409 TABLE_NOT_OPEN`. Hay un limite de items por solicitud.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrRequestInput' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/orders/qr/{token}/request-bill:
    parameters:
      - $ref: '#/components/parameters/QrToken'
    post:
      tags: [Orders - QR]
      summary: Pedir la cuenta (publico, mesa ocupada)
      description: GC-QR-0004. Crea un `service_call` `request_bill` y emite `bill:requested` al mesero asignado.
      security: []
      responses:
        '201':
          description: Llamado creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCall' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/orders/qr-requests/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - QR]
      summary: Confirmar una solicitud QR (mesero asignado)
      description: Puede ajustar los items; crea una ronda con origen `QR` vinculada a la solicitud.
      x-roles: [WAITER, ADMIN]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoundRequest' }
      responses:
        '200':
          description: Solicitud confirmada y ronda creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRoundResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /api/orders/qr-requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Orders - QR]
      summary: Rechazar una solicitud QR (mesero asignado)
      x-roles: [WAITER, ADMIN]
      responses:
        '200':
          description: Solicitud rechazada (no se crea ronda)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  # ───────────── Orders - Reportes (F10) ─────────────
  /api/orders/reports/cash-close:
    get:
      tags: [Orders - Reportes]
      summary: Vista previa del cierre de caja (ADMIN)
      description: GC-RPT-0001. Ingresos por mesero atribuidos a `openedBy`.
      x-roles: [ADMIN]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 'Consolidado del dia (sin ordenes cerradas: todos los totales en 0 y listas vacias)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashClosePreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders - Reportes]
      summary: Confirmar el cierre de caja (ADMIN)
      description: |
        GC-RPT-0002. Guarda el consolidado en `cash_closures` con sus desgloses, bloquea las ordenes del dia
        y registra `confirmedBy` y `confirmedAt`. Si el dia ya fue cerrado responde `409 DAY_CLOSED`.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '201':
          description: Cierre registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashClose' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El dia ya fue cerrado (`DAY_CLOSED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/orders/reports/dashboard:
    get:
      tags: [Orders - Reportes]
      summary: Dashboard de metricas operativas (ADMIN)
      description: REQ-F10-05. Ventas, tiempo de preparacion y platos mas vendidos.
      x-roles: [ADMIN]
      responses:
        '200':
          description: Metricas
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orders/history:
    get:
      tags: [Orders - Reportes]
      summary: Historial de ordenes con filtros (ADMIN)
      description: REQ-F10-06.
      x-roles: [ADMIN]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: waiterId, in: query, schema: { type: string, format: uuid } }
        - { name: tableId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ordenes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────── Internal (solo red Docker, X-Service-Token) ─────────────
  /internal/shifts/active/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal]
      summary: Staff - turno activo de un empleado
      description: Orders lo consulta antes de abrir una mesa (REQ-F02-05).
      security:
        - serviceToken: []
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean }
                  shift:
                    $ref: '#/components/schemas/Shift'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /internal/products:
    get:
      tags: [Internal]
      summary: Catalog - nombre, precio y disponibilidad de productos
      description: Orders lo usa al crear una ronda (snapshot R3, REQ-F03-05).
      security:
        - serviceToken: []
      parameters:
        - name: ids
          in: query
          required: true
          description: IDs de producto separados por coma
          schema: { type: string }
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [productId, name, price, isAvailable]
                  properties:
                    productId: { type: string, format: uuid }
                    name: { type: string }
                    price: { type: integer }
                    isAvailable: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /internal/tables/open:
    get:
      tags: [Internal]
      summary: Orders - mesas abiertas de un mesero
      description: Staff lo consulta al finalizar un turno (REQ-F02-04).
      security:
        - serviceToken: []
      parameters:
        - name: waiterId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Mesas abiertas
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
                  tables:
                    type: array
                    items: { $ref: '#/components/schemas/DiningTable' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token RS256 de 15 min, validado localmente por cada servicio. Se mantiene en memoria del frontend.
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Autenticacion entre servicios en rutas /internal/*.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QrToken:
      name: token
      in: path
      required: true
      description: Token aleatorio de la mesa (el QR contiene /m/<qrToken>)
      schema: { type: string }

  responses:
    Health:
      description: Servicio operativo
      content:
        application/json:
          schema:
            type: object
            required: [service, status]
            properties:
              service: { type: string }
              status: { type: string, example: ok }
    ValidationError:
      description: Datos invalidos (`VALIDATION_ERROR`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Sin sesion valida (`UNAUTHENTICATED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Sin permiso para la accion (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicto con el estado actual, por ejemplo un valor unico duplicado o un llamado pendiente (codigo `CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidTransition:
      description: Transicion de estado no definida (`INVALID_TRANSITION`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Demasiadas solicitudes (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DependencyUnavailable:
      description: Un servicio interno no respondio en 3 s (`DEPENDENCY_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              example: NOT_FOUND
              description: |
                NOT_FOUND, VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, CONFLICT, EMAIL_ALREADY_EXISTS, ACCOUNT_LOCKED, INVALID_TRANSITION,
                NO_ACTIVE_SHIFT, TABLE_ALREADY_OPEN, TABLE_NOT_OPEN, HAS_OPEN_TABLES, DAY_CLOSED,
                RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR
            message: { type: string, example: Recurso no encontrado }
            details:
              type: object
              additionalProperties: true

    # Auth
    Role:
      type: string
      enum: [ADMIN, WAITER, COOK]
    User:
      type: object
      required: [userId, email, role, isActive, createdAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        lockedUntil: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 10, description: Contrasena temporal }
        role: { $ref: '#/components/schemas/Role' }
    UpdateUserRequest:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/Session' }
    Session:
      type: object
      required: [userId, role, permissions]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { type: string, example: 'discount:apply' }

    # Staff
    Employee:
      type: object
      required: [userId, fullName, documentNumber, position, hireDate]
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30, nullable: true }
        documentNumber: { type: string, maxLength: 30 }
        position: { type: string, maxLength: 50 }
        hireDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEmployeeRequest:
      type: object
      required: [userId, fullName, documentNumber, position, hireDate]
      properties:
        userId: { type: string, format: uuid, description: userId generado por Auth }
        fullName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        documentNumber: { type: string, maxLength: 30 }
        position: { type: string, maxLength: 50 }
        hireDate: { type: string, format: date }
    UpdateEmployeeRequest:
      type: object
      properties:
        fullName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        documentNumber: { type: string, maxLength: 30 }
        position: { type: string, maxLength: 50 }
        hireDate: { type: string, format: date }
    Shift:
      type: object
      required: [shiftId, userId, scheduledStart, scheduledEnd, status]
      properties:
        shiftId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: string, format: date-time }
        actualStart: { type: string, format: date-time, nullable: true }
        actualEnd: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [programado, activo, finalizado] }
    CreateShiftRequest:
      type: object
      required: [userId, scheduledStart, scheduledEnd]
      properties:
        userId: { type: string, format: uuid }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd:
          type: string
          format: date-time
          description: Debe ser posterior a scheduledStart

    # Catalog
    Category:
      type: object
      required: [categoryId, name]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        displayOrder: { type: integer, nullable: true }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        displayOrder: { type: integer }
    Product:
      type: object
      required: [productId, categoryId, name, price, photoUrl, isAvailable]
      properties:
        productId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
        price: { type: integer, minimum: 0, description: 'COP entero (impuestos incluidos)' }
        photoUrl: { type: string, maxLength: 255 }
        isAvailable: { type: boolean }
    ProductForm:
      type: object
      required: [name, price, categoryId, photo]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string }
        price: { type: integer, minimum: 0 }
        categoryId: { type: string, format: uuid }
        isAvailable: { type: boolean }
        photo:
          type: string
          format: binary
          description: JPG, PNG o WebP, maximo 2 MB (obligatoria al crear)
    MenuCategory:
      type: object
      required: [categoryId, name, products]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string }
        products:
          type: array
          items:
            type: object
            required: [productId, name, price, photoUrl]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              description: { type: string, nullable: true }
              price: { type: integer }
              photoUrl: { type: string }

    # Orders
    TableInput:
      type: object
      required: [tableNumber]
      properties:
        tableNumber: { type: integer, minimum: 1 }
    DiningTable:
      type: object
      required: [tableId, tableNumber, qrToken]
      properties:
        tableId: { type: string, format: uuid }
        tableNumber: { type: integer }
        qrToken: { type: string, description: Token aleatorio de al menos 128 bits }
    TableState:
      type: string
      enum: [libre, ocupada, en_cobro]
    TableStatus:
      type: object
      required: [tableId, tableNumber, status, pendingCalls]
      properties:
        tableId: { type: string, format: uuid }
        tableNumber: { type: integer }
        status: { $ref: '#/components/schemas/TableState' }
        orderId: { type: string, format: uuid, nullable: true }
        waiterId: { type: string, format: uuid, nullable: true }
        pendingCalls:
          type: array
          items: { $ref: '#/components/schemas/ServiceCall' }
    Order:
      type: object
      required: [orderId, tableId, openedBy, waiterId, status, openedAt, discountAmount]
      properties:
        orderId: { type: string, format: uuid }
        tableId: { type: string, format: uuid }
        openedBy: { type: string, format: uuid }
        waiterId: { type: string, format: uuid }
        status: { type: string, enum: [ABIERTA, EN_COBRO, CERRADA] }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        discountAmount: { type: integer, minimum: 0 }
        discountAppliedBy: { type: string, format: uuid, nullable: true }
        discountAppliedAt: { type: string, format: date-time, nullable: true }
    RoundItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 255 }
    CreateRoundRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RoundItemInput' }
    ItemStatus:
      type: string
      enum: [pendiente, en_preparacion, listo, entregado, cancelado]
    Item:
      type: object
      required: [itemId, roundId, productId, productName, unitPrice, quantity, status]
      properties:
        itemId: { type: string, format: uuid }
        roundId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string, description: Snapshot (R3) }
        unitPrice: { type: integer, description: Snapshot en COP (R3) }
        quantity: { type: integer }
        note: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ItemStatus' }
        preparationStartedAt: { type: string, format: date-time, nullable: true }
        readyAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        cancelledReason: { type: string, nullable: true }
        cancelledBy: { type: string, format: uuid, nullable: true }
    Round:
      type: object
      required: [roundId, orderId, source, createdAt, items]
      properties:
        roundId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        source: { type: string, enum: [WAITER, QR] }
        qrRequestId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    CreateRoundResponse:
      type: object
      required: [round]
      properties:
        round: { $ref: '#/components/schemas/Round' }
        unavailable:
          type: array
          description: Productos no incluidos por no estar disponibles
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
    KitchenRound:
      type: object
      required: [roundId, orderId, tableNumber, createdAt, items]
      properties:
        roundId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        tableNumber: { type: integer }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    Bill:
      type: object
      required: [orderId, items, subtotal, discountAmount, total]
      properties:
        orderId: { type: string, format: uuid }
        tableNumber: { type: integer }
        items:
          type: array
          description: Solo items no cancelados
          items: { $ref: '#/components/schemas/Item' }
        subtotal: { type: integer, description: suma de unitPrice x quantity }
        discountAmount: { type: integer }
        total: { type: integer, description: subtotal - discountAmount }
    PaymentMethodInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        isCash: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
    PaymentMethod:
      type: object
      required: [paymentMethodId, name, isCash, isActive]
      properties:
        paymentMethodId: { type: string, format: uuid }
        name: { type: string }
        isCash: { type: boolean }
        isActive: { type: boolean }
    Payment:
      type: object
      required: [paymentId, orderId, paymentMethodId, subtotal, discountAmount, total, paidAt]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        paymentMethodId: { type: string, format: uuid }
        subtotal: { type: integer }
        discountAmount: { type: integer }
        total: { type: integer }
        amountReceived: { type: integer, nullable: true }
        changeGiven: { type: integer, nullable: true }
        registeredBy: { type: string, format: uuid }
        paidAt: { type: string, format: date-time }
    ServiceCall:
      type: object
      required: [serviceCallId, tableId, type, status, createdAt]
      properties:
        serviceCallId: { type: string, format: uuid }
        tableId: { type: string, format: uuid }
        type: { type: string, enum: [call_waiter, request_bill] }
        status: { type: string, enum: [pendiente, atendido] }
        createdAt: { type: string, format: date-time }
        attendedAt: { type: string, format: date-time, nullable: true }
        attendedBy: { type: string, format: uuid, nullable: true }
    QrTable:
      type: object
      required: [tableNumber, status, capabilities]
      properties:
        tableNumber: { type: integer }
        status: { $ref: '#/components/schemas/TableState' }
        capabilities:
          type: object
          required: [viewMenu, callWaiter, sendRequest, requestBill]
          properties:
            viewMenu: { type: boolean }
            callWaiter: { type: boolean }
            sendRequest: { type: boolean }
            requestBill: { type: boolean }
    QrRequestInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/RoundItemInput' }
    QrRequest:
      type: object
      required: [qrRequestId, orderId, status, createdAt]
      properties:
        qrRequestId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [pendiente, confirmada, rechazada] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedBy: { type: string, format: uuid, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/RoundItemInput' }
    CashClosePreview:
      type: object
      required:
        [
          date,
          totalSales,
          tablesServed,
          averageTicket,
          paymentBreakdown,
          topProducts,
          waiterBreakdown,
        ]
      properties:
        date: { type: string, format: date }
        totalSales: { type: integer }
        tablesServed: { type: integer }
        averageTicket: { type: integer }
        paymentBreakdown:
          type: array
          items:
            type: object
            properties:
              paymentMethodId: { type: string, format: uuid }
              totalAmount: { type: integer }
              paymentCount: { type: integer }
        topProducts:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              rank: { type: integer, minimum: 1, maximum: 5 }
              productId: { type: string, format: uuid }
              productName: { type: string }
              quantitySold: { type: integer }
        waiterBreakdown:
          type: array
          items:
            type: object
            properties:
              waiterId: { type: string, format: uuid }
              totalAmount: { type: integer }
    CashClose:
      allOf:
        - $ref: '#/components/schemas/CashClosePreview'
        - type: object
          required: [closureId, confirmedBy, confirmedAt]
          properties:
            closureId: { type: string, format: uuid }
            confirmedBy: { type: string, format: uuid }
            confirmedAt: { type: string, format: date-time }
